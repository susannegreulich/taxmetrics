# Data Collection Configuration

# OECD Data Collection Settings
oecd:
  api_key: null  # Set your OECD API key here if available
  base_url: "https://stats.oecd.org/SDMX-JSON/data"
  timeout: 30  # seconds
  retry_attempts: 3
  delay_between_requests: 1  # seconds

# Countries Configuration
countries:
  # Collection modes
  collection_modes:
    comprehensive: "all_available"  # Collect data for all available countries
    oecd_only: "oecd_members"       # Collect data for OECD members only
    major_economies: "major_economies"  # Collect data for major economies
    custom: "custom_selection"      # Collect data for custom selection
  
  # OECD Members (38 countries)
  oecd_members:
    - AUS  # Australia
    - AUT  # Austria
    - BEL  # Belgium
    - CAN  # Canada
    - CHL  # Chile
    - COL  # Colombia
    - CRI  # Costa Rica
    - CZE  # Czech Republic
    - DNK  # Denmark
    - EST  # Estonia
    - FIN  # Finland
    - FRA  # France
    - DEU  # Germany
    - GRC  # Greece
    - HUN  # Hungary
    - ISL  # Iceland
    - IRL  # Ireland
    - ISR  # Israel
    - ITA  # Italy
    - JPN  # Japan
    - KOR  # Korea
    - LVA  # Latvia
    - LTU  # Lithuania
    - LUX  # Luxembourg
    - MEX  # Mexico
    - NLD  # Netherlands
    - NZL  # New Zealand
    - NOR  # Norway
    - POL  # Poland
    - PRT  # Portugal
    - SVK  # Slovak Republic
    - SVN  # Slovenia
    - ESP  # Spain
    - SWE  # Sweden
    - CHE  # Switzerland
    - TUR  # Turkey
    - GBR  # United Kingdom
    - USA  # United States
  
  # Major Non-OECD Countries
  major_economies:
    - BRA  # Brazil
    - CHN  # China
    - IND  # India
    - IDN  # Indonesia
    - RUS  # Russian Federation
    - ZAF  # South Africa
    - ARG  # Argentina
    - SAU  # Saudi Arabia
  
  # G20 Countries
  g20_countries:
    - ARG  # Argentina
    - AUS  # Australia
    - BRA  # Brazil
    - CAN  # Canada
    - CHN  # China
    - FRA  # France
    - DEU  # Germany
    - IND  # India
    - IDN  # Indonesia
    - ITA  # Italy
    - JPN  # Japan
    - KOR  # Korea
    - MEX  # Mexico
    - RUS  # Russian Federation
    - SAU  # Saudi Arabia
    - ZAF  # South Africa
    - TUR  # Turkey
    - GBR  # United Kingdom
    - USA  # United States
    - EU   # European Union
  
  # Default selection for quick analysis
  default_selection:
    - USA  # United States
    - GBR  # United Kingdom
    - DEU  # Germany
    - FRA  # France
    - JPN  # Japan
    - CAN  # Canada
    - AUS  # Australia
  
  # Current collection mode
  current_mode: "comprehensive"  # Options: comprehensive, oecd_only, major_economies, custom

# Time Periods Configuration
time_periods:
  # Collection modes
  collection_modes:
    comprehensive: "all_available"  # Collect data for all available years
    historical: "historical_range"  # Collect data for historical analysis
    recent: "recent_range"          # Collect data for recent analysis
    custom: "custom_range"          # Collect data for custom range
  
  # Year ranges
  default_years: [2015, 2023]
  historical_years: [1965, 2023]  # OECD data typically starts from 1965
  recent_years: [2018, 2023]
  comprehensive_years: [1965, 2024]  # All available years
  
  # Annual updates
  current_year: 2024
  
  # Current collection mode
  current_mode: "comprehensive"  # Options: comprehensive, historical, recent, custom

# Data Sources
data_sources:
  revenue_statistics:
    enabled: true
    dataset_id: "REV"
    description: "Tax revenue statistics as % of GDP"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=REV"
  
  tax_rates:
    enabled: true
    dataset_id: "TAXWAGE"
    description: "Personal and corporate tax rates"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=TAXWAGE"
  
  tax_structures:
    enabled: true
    dataset_id: "TAX_STRUCT"
    description: "Tax system structure information"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=TAX_STRUCT"
  
  tax_revenue:
    enabled: false
    dataset_id: "TAX_REV"
    description: "Detailed tax revenue breakdown"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=TAX_REV"
  
  tax_policy:
    enabled: false
    dataset_id: "TAX_POL"
    description: "Tax policy indicators and reforms"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=TAX_POL"
  
  tax_database:
    enabled: false
    dataset_id: "TAX_DB"
    description: "Comprehensive tax database"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=TAX_DB"
  
  tax_statistics:
    enabled: false
    dataset_id: "TAX_STAT"
    description: "General tax statistics"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=TAX_STAT"
  
  government_revenue:
    enabled: false
    dataset_id: "GOV_REV"
    description: "Government revenue statistics"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=GOV_REV"
  
  fiscal_decentralisation:
    enabled: false
    dataset_id: "FISCAL_DEC"
    description: "Fiscal decentralisation indicators"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=FISCAL_DEC"
  
  tax_administration:
    enabled: false
    dataset_id: "TAX_ADMIN"
    description: "Tax administration statistics"
    source_url: "https://stats.oecd.org/Index.aspx?DataSetCode=TAX_ADMIN"

# Data Validation Rules
validation:
  # Required columns for each dataset
  required_columns:
    revenue_statistics:
      - country
      - country_code
      - year
      - total_tax_revenue
  
    tax_rates:
      - country
      - country_code
      - year
      - top_personal_rate
  
    tax_structures:
      - country
      - country_code
      - year
  
  # Data range validation
  value_ranges:
    total_tax_revenue: [0, 100]  # % of GDP
    top_personal_rate: [0, 100]  # %
    corporate_rate: [0, 100]  # %
    vat_rate: [0, 100]  # %
    social_security_rate: [0, 50]  # %

# Output Settings
output:
  # Directory structure
  base_directory: "data"
  raw_data_directory: "data/oecd/raw"
  processed_data_directory: "data/oecd/processed"
  reports_directory: "data/oecd/reports"
  
  # File formats
  csv_enabled: true
  excel_enabled: true
  json_enabled: false
  
  # File naming
  timestamp_format: "%Y%m%d_%H%M%S"
  include_timestamp: true
  
  # Data compression
  compress_large_files: true
  compression_threshold_mb: 10

# Processing Options
processing:
  # Data cleaning
  remove_duplicates: true
  handle_missing_values: true
  remove_outliers: true
  outlier_method: "iqr"  # Options: iqr, zscore
  
  # Data transformation
  standardize_country_names: true
  add_derived_variables: true
  create_analysis_ready_dataset: true
  
  # Summary statistics
  generate_summaries: true
  include_correlations: true
  include_trends: true

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_logging: true
  log_file: "logs/data_collection.log"
  max_log_size_mb: 10
  backup_count: 5 